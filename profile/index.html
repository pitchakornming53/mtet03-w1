<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อมูลส่วนตัว</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: #000000;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 16px;
    }

    .card {
        width: 100%;
        max-width: 420px;
        background-color: #1a1a1a;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        overflow: hidden;
        text-align: center;
    }

    .cover {
        height: 90px;
        background: linear-gradient(135deg, #3a3a3a, #000000);
    }

    .avatar {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 4px solid #1a1a1a;
        object-fit: cover;
        margin-top: -70px;
        background-color: #2b2b2b;
    }

    .name {
        margin-top: 14px;
        font-size: 24px;
        font-weight: bold;
        color: #ffffff;
    }

    .divider {
        height: 2px;
        background-color: #444444;
        margin: 20px 28px;
    }

    .info {
        text-align: left;
        padding: 0 28px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
    }

    .info-row {
        display: flex;
        gap: 10px;
        font-size: 14px;
        color: #dddddd;
    }

    .info-row .label {
        min-width: 84px;
        color: #999999;
        font-weight: bold;
    }

    .links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        padding: 0 24px 28px;
    }

    .links a {
        text-decoration: none;
        color: #000000;
        background-color: #ffffff;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: bold;
        transition: background-color 0.15s ease;
    }

    .links a:hover {
        background-color: #cccccc;
    }
</style>
</head>
<body>

    <div class="card">
        <div class="cover"></div>

        <img class="avatar" src="assets/avatar.png" alt="รูปโปรไฟล์">

        <div class="name">พิชชากร พิพัฒน์กุลดิลก</div>

        <div class="divider"></div>

        <div class="info">
            <div class="info-row"><span class="label">อีเมล:</span><span>s6603014620177@email.kmutnb.ac.th</span></div>
            <div class="info-row"><span class="label">เบอร์โทร:</span><span>087-497-7722</span></div>
        </div>

        <div class="links">
            <a href="mailto:s6603014620177@email.kmutnb.ac.th">Email</a>
            <a href="tel:0874977722">โทร</a>
        </div>
    </div>

</body>
</html>

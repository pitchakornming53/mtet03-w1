<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0d0000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            width: 360px;
            height: 580px;
            background-color: #1a0000;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .display-container {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 24px 18px 8px 18px;
            min-height: 140px;
        }

        .sub-display {
            font-size: 16px;
            color: #cc3333;
            min-height: 24px;
            margin-bottom: 5px;
        }

        .main-display {
            font-size: 48px;
            font-weight: bold;
            color: #ff4444;
            width: 100%;
            text-align: right;
            overflow: hidden;
            white-space: nowrap;
        }

        .divider {
            height: 2px;
            background-color: #5c0000;
            margin: 8px 0;
            width: 100%;
        }

        .keypad {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 10px;
            padding: 12px;
            background-color: #1a0000;
        }

        button {
            border: none;
            border-radius: 5px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.1s ease;
        }

        /* Default Number Buttons */
        .btn-num {
            background-color: #2b0000;
            color: #ff8888;
        }
        .btn-num:hover, .btn-num:active { background-color: #3d0000; color: #ffffff; }

        /* Operator Buttons */
        .btn-op {
            background-color: #8b0000;
            color: #ff9999;
        }
        .btn-op:hover, .btn-op:active { background-color: #aa0000; color: #ffffff; }

        /* Special Action Buttons */
        .btn-spec {
            background-color: #3d0000;
            color: #ff6666;
        }
        .btn-spec:hover, .btn-spec:active { background-color: #550000; color: #ffffff; }

        /* Equals Button */
        .btn-eq {
            background-color: #cc0000;
            color: #ffffff;
        }
        .btn-eq:hover, .btn-eq:active { background-color: #ff2222; }

    </style>
</head>
<body>

    <div class="calculator">
        <div class="display-container">
            <div class="sub-display" id="subDisplay"></div>
            <div class="main-display" id="mainDisplay">0</div>
        </div>
        <div class="divider"></div>
        <div class="keypad" id="keypad">
            <!-- Buttons will be generated by JavaScript -->
        </div>
    </div>

    <script>
        const buttons = [
            ["C", "±", "%", "÷"],
            ["7", "8", "9", "×"],
            ["4", "5", "6", "−"],
            ["1", "2", "3", "+"],
            ["00", "0", ".", "="]
        ];

        let expression = "";
        const mainDisplay = document.getElementById("mainDisplay");
        const subDisplay = document.getElementById("subDisplay");
        const keypad = document.getElementById("keypad");

        // สร้างปุ่มทั้งหมด
        buttons.flat().forEach(label => {
            const btn = document.createElement("button");
            btn.textContent = label;
            
            // กำหนดคลาสสีตามประเภทของปุ่มให้เหมือนใน Python
            if (label === "=") {
                btn.className = "btn-eq";
            } else if (["÷", "×", "−", "+"].includes(label)) {
                btn.className = "btn-op";
            } else if (["C", "±", "%"].includes(label)) {
                btn.className = "btn-spec";
            } else {
                btn.className = "btn-num";
            }

            btn.addEventListener("click", () => onClick(label));
            keypad.appendChild(btn);
        });

        function onClick(label) {
            if (label === "C") {
                expression = "";
                mainDisplay.textContent = "0";
                subDisplay.textContent = "";
            } 
            else if (label === "±") {
                try {
                    let val = -parseFloat(safeEval(expression));
                    expression = formatNumber(val);
                    mainDisplay.textContent = displayExpr(expression);
                } catch (e) {}
            } 
            else if (label === "%") {
                try {
                    let val = parseFloat(safeEval(expression)) / 100;
                    expression = formatNumber(val);
                    mainDisplay.textContent = displayExpr(expression);
                } catch (e) {
                    mainDisplay.textContent = "Error";
                }
            } 
            else if (label === "=") {
                try {
                    subDisplay.textContent = displayExpr(expression) + " =";
                    let result = safeEval(expression);
                    let formattedResult = formatNumber(result);
                    mainDisplay.textContent = displayExpr(formattedResult);
                    expression = formattedResult;
                } catch (e) {
                    mainDisplay.textContent = "Error";
                    expression = "";
                }
            } 
            else {
                const symMap = {"÷": "/", "×": "*", "−": "-"};
                const char = symMap[label] || label;

                if (["÷", "×", "−", "+"].includes(label)) {
                    if (expression && "/*-+".includes(expression.slice(-1))) {
                        expression = expression.slice(0, -1);
                    }
                    if (!expression) {
                        expression = "0";
                    }
                } else if (label === ".") {
                    // ป้องกันการใส่จุดซ้ำในตัวเลขเดียวกัน
                    let parts = expression.split(/[\+\-\*\/]/);
                    let lastNum = parts[parts.length - 1];
                    if (lastNum.includes(".")) return;
                } else if (label === "00") {
                    if (!expression || expression === "0") return;
                }

                expression += char;
                mainDisplay.textContent = displayExpr(expression);
            }
        }

        // ฟังก์ชันคำนวณแบบปลอดภัย (จำลอง eval แต่กรองตัวอักษร)
        function safeEval(expr) {
            if (!expr) return 0;
            const allowed = /^[0-9\.\+\-\*\/\(\)\s]+$/;
            if (!allowed.test(expr)) {
                throw new Error("Invalid expression");
            }
            // ใช้ Function แทน eval ตรงๆ
            return new Function('return ' + expr)();
        }

        // จัดการทศนิยม
        function formatNumber(val) {
            if (Number.isInteger(val)) {
                return val.toString();
            }
            // ปัดเศษที่ 10 ตำแหน่งและตัดเลข 0 ด้านหลังออก
            return parseFloat(val.toFixed(10)).toString();
        }

        // แปลงเครื่องหมายเวลาแสดงผลและจัดการความยาวตัวอักษร
        function displayExpr(expr) {
            let result = expr.replace(/\*/g, "×").replace(/\//g, "÷").replace(/-/g, "−");
            return result.length > 16 ? result.slice(-16) : result;
        }
    </script>
</body>
</html>
